<style>
/* Fonts are served from this site so the page makes no third-party requests. IBM Plex, SIL Open Font Licence (fonts/OFL.txt). */
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/ibm-plex-mono-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/ibm-plex-mono-latin-600-normal.woff2) format("woff2")}
/* One screen, drawn as a map. Four territories (pay, saving, home, tax) with a border and a name each, panels inside
   them shaped like the screen, and routes through the gaps between panels showing what feeds what. Tapping a panel
   zooms the camera into it and opens its page. Every size is in rem; 1rem is set from the screen so nothing scrolls. */
:root{
  --bg:#040906; --panel:#08130c; --line:#17402a; --dim:#2fa866; --fg:#9df5be; --hot:#5dffa0; --warn:#ffb84a; --ink:#041007;
  --z-pay:#5dffa0; --z-save:#63e6ff; --z-home:#ffc457; --z-tax:#ff9bd2;   /* one hue per territory, for names and edges */
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --field:max(16px,1.15rem);   /* 16px or more stops phones zooming in when a figure is typed */
  color-scheme:dark;
}
html{height:100%;font-size:12px;font-size:clamp(9px,min(1.75vh,3.2vw),15px);font-size:clamp(9px,min(1.75dvh,3.2vw),15px);-webkit-text-size-adjust:100%;text-size-adjust:100%}
*{box-sizing:border-box}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--mono);font-weight:500;font-size:1rem;line-height:1.25;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--hot);outline-offset:2px}
[hidden]{display:none!important}
#stage{position:relative;height:100vh;height:100dvh;max-width:34rem;margin:0 auto;display:flex;flex-direction:column;gap:.5rem;
  padding:max(.6rem,env(safe-area-inset-top)) max(1.2rem,env(safe-area-inset-right)) max(.6rem,env(safe-area-inset-bottom)) max(1.2rem,env(safe-area-inset-left))}
.bar{flex:none;display:flex;align-items:center;gap:.6rem;min-height:2.3rem;font-size:.9rem;color:var(--dim)}
/* the way back to the map sits in the top bar, shown only on a page, so a page can open with its name exactly where the panel had it */
#topmap{margin-left:auto;min-height:2.3rem;font-size:1.05rem;visibility:hidden}
#stage.paged #topmap,#stage.paged #botmap{visibility:visible}
/* a second way back, bottom right, beside the log lines */
#botmap{position:absolute;right:max(1.2rem,env(safe-area-inset-right));bottom:max(.6rem,env(safe-area-inset-bottom));z-index:6;visibility:hidden}
#stage.paged #log{padding-right:8rem}
.bar b{color:var(--hot);font-weight:600;letter-spacing:.06em}
.bar a{margin-left:auto;color:var(--dim);font-size:.8rem;text-decoration:underline;text-underline-offset:.2em}
.cursor{display:inline-block;width:.55em;height:1em;background:var(--hot);vertical-align:-.12em;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
#view{position:relative;flex:1 1 auto;min-height:0;overflow:hidden}
/* ---- the map ---- */
#map{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,1fr);gap:1.5rem 1.35rem;padding-top:.45rem;transform-origin:0 0;
  transition:transform .36s cubic-bezier(.7,0,.2,1);
  background-image:linear-gradient(to right,rgba(47,168,102,.09) 1px,transparent 1px),linear-gradient(to bottom,rgba(47,168,102,.09) 1px,transparent 1px);background-size:2.4rem 2.4rem}
#map.gone{visibility:hidden}
#map.snap{transition:none}
.zone{position:relative;min-width:0;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,1fr);gap:.95rem .8rem;
  padding:.75rem .3rem .3rem;border:1px solid color-mix(in srgb,var(--z) 55%,transparent);border-radius:.6rem;background:color-mix(in srgb,var(--z) 5%,transparent)}
.zone h2{position:absolute;top:-.6rem;left:.5rem;margin:0;padding:0 .35rem;background:var(--bg);font-size:.74rem;font-weight:600;letter-spacing:.12em;color:var(--z);white-space:nowrap}
.tile{position:relative;z-index:1;display:flex;flex-direction:column;min-width:0;min-height:0;text-align:left;background:var(--panel);border:1px solid var(--line);border-top:2px solid var(--z);border-radius:.25rem;padding:.25rem .3rem;overflow:hidden;
  transition:border-color .3s,box-shadow .3s}
/* one size for every panel name, on one line: set by the longest name in the width of a panel */
.tile .nm{display:block;max-width:100%;font-size:.98rem;font-weight:600;letter-spacing:-.035em;word-spacing:-.3em;line-height:1.15;white-space:nowrap;color:var(--z)}
.tile .q{font-size:.58rem;color:var(--fg);line-height:1.2;min-height:2.4em;margin:.05rem 0 .15rem}
.tile .un{display:block;font-size:.5rem;color:var(--dim);line-height:1.1}
.tile .bg{display:block;max-width:100%;overflow:hidden;font-size:.95rem;font-weight:600;color:var(--hot);white-space:nowrap;letter-spacing:-.04em}
.tile .blk{display:block;min-width:0;border-top:1px dashed var(--line);margin-top:.15rem;padding-top:.12rem}
.tile .io,.tile .ln{display:flex;justify-content:space-between;gap:.2rem;overflow:hidden;font-size:.5rem;color:var(--dim);white-space:nowrap;line-height:1.32}
.tile .io span:first-child,.tile .ln span:first-child{overflow:hidden;text-overflow:ellipsis}
.tile .io span:last-child{color:var(--hot);flex:none}
.tile .ln span:last-child{color:var(--fg);flex:none}
.tile .to{display:block;margin-top:auto;font-size:.5rem;color:var(--z);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.tile.hot,.lnk.hot{border-color:var(--hot);box-shadow:0 0 .7rem rgba(93,255,160,.35),inset 0 0 .6rem rgba(93,255,160,.12)}
.tile.aux{border-top-width:1px;border-style:dashed;justify-content:center;gap:.3rem;--z:var(--dim)}
.tile.aux .go{font-size:.8rem;font-weight:600;color:var(--ink);background:var(--hot);border-radius:.2rem;padding:.3rem .1rem;line-height:1.15;text-align:center}
.tile.aux .ex{font-size:.52rem;color:var(--dim);line-height:1.3}
.tile.aux .ex b{color:var(--fg);font-weight:500}
/* movement: dots circle each territory on a canvas over the map, so the solid territory borders are dropped while it runs */
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
#map.live .zone{border-color:transparent}
#map.live .tile{transition:border-color .3s,box-shadow .3s,opacity .35s,transform .25s}
.tile.dim{opacity:.22}
.tile.pick,#map.live .tile.pick{transition:none;border-color:#fff;box-shadow:0 0 0 .12rem var(--z),0 0 1.6rem var(--z),inset 0 0 1rem color-mix(in srgb,var(--z) 35%,transparent)}
.tile.hit{transform:scale(1.045);border-color:var(--hot);box-shadow:0 0 1.2rem color-mix(in srgb,var(--z) 70%,transparent),inset 0 0 .8rem color-mix(in srgb,var(--z) 25%,transparent)}
.chip{position:absolute;z-index:3;transform:translate(-50%,-50%);padding:.1rem .35rem;border:1px solid var(--z);border-radius:.25rem;background:var(--bg);color:var(--z);font-size:1.05rem;font-weight:600;white-space:nowrap;
  box-shadow:0 0 .8rem color-mix(in srgb,var(--z) 60%,transparent);pointer-events:none;animation:chip 2.6s ease-out both}
@keyframes chip{0%{opacity:0;transform:translate(-50%,-10%) scale(.6)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}22%{transform:translate(-50%,-50%) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-130%)}}
/* routes: lines through the gaps between panels, with dashes that drift from a panel to what it feeds */
#wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:0}
#wires path{fill:none;stroke:var(--z);stroke-width:1.3;stroke-dasharray:3 4;opacity:.75;animation:flow 1.1s linear infinite}
#wires path.live{stroke:var(--hot);stroke-width:2.2;stroke-dasharray:none;opacity:1;filter:drop-shadow(0 0 3px var(--hot))}
#wires polygon{fill:var(--z);opacity:.9}
#wires circle{fill:var(--hot)}
@keyframes flow{to{stroke-dashoffset:-7}}
/* ---- a page: one panel, zoomed in ---- */
/* The page opens with the lit frame the chosen panel had on the map, in its territory's colour. The frame starts to dim at once and over a few seconds
   reaches the faint green glow panels have on the map, so going back to the map shows the same thing it shrinks into. */
#detail{--pad:.55rem;--rest:inset 0 0 0 .06rem rgba(93,255,160,.18),inset 0 0 2.6rem rgba(93,255,160,.13);position:absolute;inset:0;isolation:isolate;display:flex;flex-direction:column;gap:.28rem;padding:var(--pad);
  background:var(--panel);opacity:0;pointer-events:none;transition:opacity .22s;border:1px solid var(--dim);border-top:2px solid var(--z);border-radius:.5rem;box-shadow:var(--rest)}
#detail.on{animation:settle 3s ease-out both}
@keyframes settle{0%{border-color:#fff;box-shadow:inset 0 0 0 .12rem var(--z),inset 0 0 1.5rem color-mix(in srgb,var(--z) 40%,transparent)}
  100%{border-color:var(--dim);border-top-color:var(--z);box-shadow:var(--rest)}}
/* faint green characters fall behind the page */
/* the same across the map: blended in as light only, so it shows faintly through the territories and panels without covering anything */
#mrain{position:absolute;inset:0;width:100%;height:100%;z-index:2;opacity:.26;mix-blend-mode:screen;pointer-events:none}
#rain{position:absolute;inset:0;width:100%;height:100%;z-index:-1;opacity:.17;border-radius:inherit;pointer-events:none}
#detail.on{opacity:1;pointer-events:auto}
/* The page's name is the panel's name as the zoom leaves it: the same words, size and place (--hs, --hx, --hy are set from the panel when the page opens). */
.dhead{flex:none;border-bottom:1px solid var(--line);padding-bottom:.2rem}
.dhead h1{margin:max(0px,calc(var(--hy,0px) - var(--pad) - 1px)) 0 0 max(0px,calc(var(--hx,0px) - var(--pad) - 1px));font-size:var(--hs,1.9rem);font-weight:600;letter-spacing:-.035em;word-spacing:-.3em;line-height:1.15;color:var(--z);white-space:nowrap}
.back{flex:none;display:flex;align-items:center;gap:.4rem;min-height:3rem;padding:0 1rem;border-radius:.3rem;background:var(--hot);color:var(--ink);font-size:1.15rem;font-weight:600;letter-spacing:.06em}
.back:active{background:var(--fg)}
.dbig{flex:none}
.dq{font-size:1.05rem;color:var(--fg)}
.dbig .cap{font-size:.85rem;color:var(--dim)}
.dbig .fig{font-size:2.7rem;font-weight:600;color:var(--hot);line-height:1.05;letter-spacing:-.04em;white-space:nowrap}
.meter{font-size:.9rem;letter-spacing:-.06em;color:var(--hot);white-space:nowrap;overflow:hidden}
.meter i{font-style:normal;color:var(--line)}
.dwarn{font-size:.85rem;color:var(--warn);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* the sections of a page */
.tabs{flex:none;display:flex;gap:.3rem;border-bottom:1px solid var(--line)}
.tabs button{flex:1 1 auto;min-height:2.3rem;padding:0 .2rem;font-size:.82rem;font-weight:600;letter-spacing:.04em;color:var(--dim);border:1px solid var(--line);border-bottom:0;border-radius:.3rem .3rem 0 0;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);background:var(--z);border-color:var(--z)}
.pane{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:.3rem;overflow:hidden}
.pane.scroll{overflow:auto;overscroll-behavior:contain;display:block}
.sec{font-size:.75rem;letter-spacing:.1em;color:var(--dim);border-bottom:1px dashed var(--line);padding-bottom:.15rem;margin-bottom:.3rem}
.inrow{display:flex;align-items:center;gap:.4rem;margin-bottom:.3rem;min-height:2.5rem}
.inrow .lab{flex:1 1 auto;min-width:0;font-size:.95rem;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inrow .lab small{display:block;font-size:.7rem;color:var(--dim);overflow:hidden;text-overflow:ellipsis}
.inrow .val{flex:0 0 7.4rem;min-height:2.5rem;text-align:right;font-size:1.12rem;font-weight:600;color:var(--hot);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-bottom:1px dotted var(--line)}
.inrow .val.wide{flex-basis:9.6rem;font-size:.92rem}
.inrow .val.long{font-size:.92rem;letter-spacing:-.03em}
.inrow .val.carried{text-decoration:underline dashed;text-underline-offset:.2em}
.inrow .val.off{color:var(--dim);border-bottom-color:transparent}
.inrow input{flex:0 0 7.4rem;width:7.4rem;min-height:2.5rem;text-align:right;font:inherit;font-size:var(--field);font-weight:600;color:var(--ink);background:var(--hot);border:0;border-radius:.2rem;padding:0 .3rem}
.st{flex:none;width:2.5rem;height:2.5rem;border:1px solid var(--dim);border-radius:.25rem;font-size:1.4rem;font-weight:600;color:var(--hot);line-height:1}
.st:active{background:var(--dim);color:var(--ink)}
.st:disabled{opacity:.3}
.st.rs{width:2rem;border-style:dashed;font-size:1.1rem}
.out{display:flex;gap:.4rem;font-size:.98rem;line-height:1.5}
.out .k{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.out .dots{flex:1 1 1rem;min-width:.5rem;overflow:hidden;color:var(--line);white-space:nowrap}
.out .v{flex:none;color:var(--hot);font-weight:600;white-space:nowrap}
.out.key{font-size:1.15rem;font-weight:600;border-top:1px dashed var(--line);margin-top:.2rem;padding-top:.2rem}
.out.key .k{color:var(--hot)}
/* links to other pages: big, labelled, and plainly something to tap */
.links{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:.4rem}
.lnk{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;column-gap:.5rem;min-height:3.2rem;text-align:left;background:var(--panel);
  border:1px solid var(--z);border-left-width:.35rem;border-radius:.25rem;padding:.3rem .5rem;transition:border-color .3s,box-shadow .3s}
.lnk:only-child{grid-column:1/-1}
.links.many{grid-template-columns:repeat(3,minmax(0,1fr));gap:.3rem}
.links.many .lnk{min-height:2.5rem;column-gap:.3rem;padding-left:.35rem;padding-right:.3rem}
.links.many .lnk .bg,.links.many .lnk .go{display:none}
.links.many .lnk .nm{font-size:.85rem;letter-spacing:-.03em}
.links.many .lnk .ar{font-size:1.1rem}
.lnk:active{background:var(--line)}
.lnk .ar{font-size:1.5rem;font-weight:600;color:var(--z);line-height:1}
.lnk .to{font-size:.7rem;letter-spacing:.08em;color:var(--dim)}
.lnk .nm{font-size:1rem;font-weight:600;color:var(--z);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lnk .bg{font-size:.82rem;color:var(--fg);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lnk .go{font-size:1.3rem;color:var(--z)}
.none{font-size:.85rem;color:var(--dim)}
.clr{display:block;width:100%;min-height:2.6rem;margin:.6rem 0 .3rem;border:1px dashed var(--warn);border-radius:.25rem;color:var(--warn);font-size:.85rem;letter-spacing:.06em}
.clr.sure{border-style:solid;background:var(--warn);color:var(--bg);font-weight:600}
/* tables and notes inside a page */
table{border-collapse:collapse;width:100%;font-size:max(.8rem,11px);font-variant-numeric:tabular-nums;white-space:nowrap}
th,td{padding:.3rem .28rem;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--panel)}
thead th{position:sticky;top:0;background:var(--panel);color:var(--dim);font-weight:500;z-index:1}
thead th:first-child{z-index:2}
td{color:var(--fg)}
tr.key td{color:var(--hot);font-weight:600}
tr.mark td{text-align:left;color:var(--warn);white-space:normal}
.note{font-size:max(.9rem,12px);line-height:1.4;color:var(--fg);margin:0 0 .7rem}
.note.w{color:var(--warn)}
/* the log of what just changed */
#log{flex:none;height:3.9rem;overflow:hidden;border-top:1px solid var(--line);padding-top:.3rem;font-size:.78rem;color:var(--dim);display:flex;flex-direction:column;justify-content:flex-end}
#log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:type .35s steps(24) both}
#log div b{color:var(--hot);font-weight:500}
@keyframes type{from{max-width:0}to{max-width:100%}}
/* The CRT look is the look of the whole app. Bright text glows in its own colour; scanlines and a soft vignette lie over the full screen. */
.bar b,.zone h2,.tile .nm,.tile .bg,.tile .to,.dhead h1,.dq,.fig,.val,.out .v,.meter,.lnk .nm,.lnk .ar,.lnk .go,.st,#log b,.sec{text-shadow:0 0 .5em color-mix(in srgb,currentColor 60%,transparent)}
.back,.tile.aux .go{box-shadow:0 0 .9rem rgba(93,255,160,.45)}
.tile,.lnk,.st{box-shadow:inset 0 0 .8rem rgba(93,255,160,.06)}
body::after{content:"";position:fixed;inset:0;z-index:50;pointer-events:none;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.24) 3px),radial-gradient(ellipse at center,rgba(0,0,0,0) 62%,rgba(0,0,0,.28) 100%)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<div id="stage">
  <div class="bar"><b>JR1 MONEY</b><span class="cursor" aria-hidden="true"></span><button type="button" class="back" id="topmap">‹ MAP</button></div>
  <main id="view">
    <div id="map" aria-label="All calculators"><canvas id="mrain" aria-hidden="true"></canvas><svg id="wires" aria-hidden="true"></svg><canvas id="fx" aria-hidden="true"></canvas></div>
    <section id="detail"></section>
  </main>
  <div id="log" aria-live="polite"><div>&gt; starting…</div></div>
  <button type="button" class="back" id="botmap">‹ MAP</button>
  <noscript><p class="note">These calculators need JavaScript turned on. Everything runs on your device; nothing is sent anywhere.</p></noscript>
</div>
<script>
// Rates for each tax year the calculator offers. Income tax outside Scotland and National Insurance are the same in all three years.
// Band thresholds are income above the tax-free allowance, except the last (125,140), which is total income.
const RUK=[[0,.20],[37700,.40],[125140,.45]];
const NI={pt:12570/12,uel:50270/12,main:.08,upper:.02};
const YEARS={
  "2025":{label:"2025/26",sco:[[0,.19],[2827,.20],[14921,.21],[31092,.42],[62430,.45],[125140,.48]],
    loans:{p1:26065,p2:28470,p4:32745,p5:25000,pg:21000},cb:{first:26.05,other:17.25},
    status:"These are the final rates for 2025/26."},
  "2026":{label:"2026/27",sco:[[0,.19],[3967,.20],[16956,.21],[31092,.42],[62430,.45],[125140,.48]],
    loans:{p1:26900,p2:29385,p4:33795,p5:25000,pg:21000},cb:{first:27.05,other:17.90},
    status:"These are the published rates for 2026/27."},
  "2027":{label:"2027/28",sco:[[0,.19],[3967,.20],[16956,.21],[31092,.42],[62430,.45],[125140,.48]],
    loans:{p1:26900,p2:29385,p4:33795,p5:25000,pg:21000},cb:{first:27.05,other:17.90},
    status:"2027/28 is a forecast. UK income tax and NI thresholds are confirmed as unchanged for 2027/28. Scottish bands, Child Benefit and student loan thresholds for 2027/28 were not set when this was built, so the 2026/27 figures are used."}
};
const Y=s=>YEARS[s.year]||YEARS["2027"];
const monthsFor=y=>["Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec","Jan","Feb","Mar"].map((m,i)=>m+" "+String((+y+(i>8?1:0))%100).padStart(2,"0"));
let MONTHS=monthsFor("2027");
const blank=()=>({region:"eng",salary:null,pensionMode:"pct",eePct:5,erPct:3,netTarget:null,method:"sacrifice",
  bonusType:"amount",bonusValue:null,bonusMonth:12,bsType:"none",bsValue:null,
  risePct:null,riseFrom:1,bik:null,allowance:12570,loan:"",pg:"0",children:null,sac:[],post:[],year:"2027",ppView:null,ppDdAge:null,lsType:"none",lsAmount:null,lsAge:null,
  // pension pot screen: cautious defaults
